apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-serve
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/casablanque-code/mlops-mini-lab.git
    targetRevision: main
    path: deploy/serve-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
