name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Hard floor for test-set accuracy on the CI smoke run. Deliberately
  # loose: the smoke dataset is tiny (300 samples, 6 features, for
  # speed), so accuracy is noisier than on a full training run -- this
  # threshold exists to catch a broken pipeline (e.g. a bug that makes
  # predictions effectively random, around 0.5-0.6 for this class
  # balance), not to gate on model quality in the way a real training
  # run's metrics should be judged. See docs/decisions.md for why a
  # fixed threshold was chosen first and what a commit-to-commit
  # comparison (e.g. via `dvc metrics diff`) would add on top.
  MIN_ACCURACY: "0.65"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        run: pytest tests -v

  smoke-pipeline:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate small dataset
        run: python src/data/make_dataset.py --n-samples 300 --n-features 6 --output data/raw/dataset.csv

      - name: Prepare data
        run: python src/data/prepare.py --input data/raw/dataset.csv --output-dir data/processed

      - name: Train smoke model
        run: |
          python src/train.py \
            --train-path data/processed/train.csv \
            --test-path data/processed/test.csv \
            --n-estimators 20 \
            --model-out models/model.joblib

      - name: Evaluate
        run: python src/evaluate.py --model-path models/model.joblib --test-path data/processed/test.csv

      - name: Enforce minimum accuracy
        run: |
          python -c "
          import json, sys
          metrics = json.load(open('metrics.json'))
          accuracy = metrics['accuracy']
          threshold = float('${{ env.MIN_ACCURACY }}')
          print(f'accuracy={accuracy} threshold={threshold}')
          if accuracy < threshold:
              print(f'::error::Model accuracy {accuracy} is below the minimum {threshold}')
              sys.exit(1)
          "

  build-images:
    runs-on: ubuntu-latest
    needs: smoke-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Build train image
        run: docker build -f docker/Dockerfile.train -t mlops-mini-lab-train:ci .

      - name: Build serve image
        run: docker build -f docker/Dockerfile.serve -t mlops-mini-lab-serve:ci .
