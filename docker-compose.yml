services:
  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.16.2 &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri /mlflow/mlruns
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  train:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    profiles:
      - train
    command: >
      sh -c "python src/data/make_dataset.py &&
             python src/data/prepare.py &&
             python src/train.py --registered-model-name mlops-mini-lab"

  serve:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    depends_on:
      - mlflow
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      # Default to the plain local file so `docker compose up serve`
      # keeps working without a registry entry. Switch to the registry
      # once you've run `train` with --registered-model-name and
      # promoted a version to Production:
      #   MODEL_URI=models:/mlops-mini-lab/Production
      - MODEL_URI=file:./models/model.joblib
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - N_FEATURES=8

volumes:
  mlflow_data:
